# Continuous integration for RngBuffer
# - host unit tests (tests/Makefile) with gcc and clang, most variants under
#   AddressSanitizer and UndefinedBehaviorSanitizer
# - example sketches compiled with Arduino CLI for AVR, SAMD and ESP32
# - example sketches compiled with PlatformIO for nRF52 on the n-able core, whose
#   Arduino.h declares a class RingBuffer (the name clash that 2.0.0 removed)

name: CI

on:
  push:
    branches: [main, testing]
  workflow_dispatch:

jobs:
  host-tests:
    name: Host tests (${{ matrix.cc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - cc: gcc
            cxx: g++
          - cc: clang
            cxx: clang++
    steps:
      - uses: actions/checkout@v7
      - name: Build and run
        run: make -C tests CC=${{ matrix.cc }} CXX=${{ matrix.cxx }}

  examples-arduino:
    name: Examples (${{ matrix.fqbn }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - fqbn: arduino:avr:uno
            platforms: |
              - name: arduino:avr
          - fqbn: arduino:samd:mkrzero
            platforms: |
              - name: arduino:samd
          - fqbn: esp32:esp32:esp32
            platforms: |
              - name: esp32:esp32
                source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    steps:
      - uses: actions/checkout@v7
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.fqbn }}
          platforms: ${{ matrix.platforms }}
          libraries: |
            - source-path: ./
          sketch-paths: |
            - examples

  examples-nrf52:
    name: Examples (nRF52840, n-able core)
    runs-on: ubuntu-latest
    env:
      PLATFORM: https://github.com/h2zero/platform-n-able.git#1.2.0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Install PlatformIO and the n-able platform
        run: |
          pip install platformio
          pio pkg install --global --platform "$PLATFORM"
      - name: Compile examples
        run: |
          for sketch in examples/*/*.ino; do
            echo "== $sketch"
            pio ci "$sketch" --lib . --board generic_nrf52840 --project-option "platform=$PLATFORM"
          done
