sentence=FIFO ring buffer in C over caller storage, for bytes or fixed-size elements.
paragraph=Whole-element put and get, multi-element transfers under one lock, and status codes that report a lock failure apart from full and empty. Weak lock hooks let an interrupt and a task share a buffer. No heap, no Arduino API.
